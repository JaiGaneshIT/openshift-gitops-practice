apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-information
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-information
  template:
    metadata:
      labels:
        app: cluster-information
    spec:
      containers:
        - name: web
          image: docker.io/nginxinc/nginx-unprivileged:alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
